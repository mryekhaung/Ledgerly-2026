name: ledgerly
description: "A Budget Tracker & Manager Flutter project — compact, premium personal finance for iOS/Android/web."
publish_to: 'none'
version: 1.0.0+28

# Toolchain is pinned by .fvmrc (Flutter 3.47.1). CI must use the same version.
# See docs/Versions.md — that file is the single source of truth for versions.
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  # Flutter 3.47+: Material and Cupertino are standalone, independently released packages.
  # Import `package:material_ui/...` and `package:cupertino_ui/...`,
  # NEVER `package:flutter/material.dart` or `package:flutter/cupertino.dart`. See docs/Versions.md §2.
  adaptive_platform_ui: ^1.0.2
  # Ships the CupertinoIcons font. cupertino_ui does not depend on it, so without
  # this every Cupertino glyph (back chevron, ...) renders as a ? box.
  cupertino_icons: ^1.0.9
  cupertino_ui: ^1.1.2
  # Local-first persistence. SQLite is the source of truth (docs/Architecture.md ADR #1).
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  # i18n delegates (en / my / ja)
  flutter_localizations:
    sdk: flutter
  # Presentation state (docs/Architecture.md §5). Riverpod 3.x only — no legacy providers.
  flutter_riverpod: ^3.4.3
  # Dependency wiring for data/domain (docs/Architecture.md §10)
  flutter_svg: ^2.3.0
  get_it: ^9.3.0
  # Routing (docs/Architecture.md §9)
  go_router: ^17.5.0
  # Date/number formatting
  intl: ^0.20.3
  material_ui: ^1.6.0
  # Client-generated UUIDv4 primary keys (docs/Architecture.md ADR #3) — offline-safe ids.
  uuid: ^4.5.1

dev_dependencies:
  # Drift schema codegen (same minor as `drift`). Run: dart run build_runner build
  build_runner: ^2.4.13
  drift_dev: ^2.32.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Avatar v2 art (docs/Avatar.md §3). Subdirs are listed explicitly: a directory entry is not recursive.
  assets:
    - assets/avatar/open_peeps/
    - assets/avatar/open_peeps/head/
    - assets/avatar/open_peeps/expression/
    - assets/avatar/open_peeps/facial_hair/
    - assets/avatar/open_peeps/accessories/
    - assets/avatar/open_peeps/mask/
    - assets/avatar/open_peeps/base/

  # Required by `flutter gen-l10n` with an explicit `output-dir` (Flutter ≥3.32):
  # without it the tool warns that the generated sources "will not be importable".
  # The generated files are committed, so CI needs no extra step to build them.
  generate: true

  # Fonts are bundled in Phase 0 (Roadmap) so web has a reliable fallback.
  # Inter = amounts/Latin · Noto Sans Myanmar = my · Noto Sans JP = ja.
  # Asset files land in assets/fonts/ — see docs/Design.md §3.
