name: CI

on:
  push:
    # Long-lived branches only (docs/Conventions.md §7):
    #   dev  = default working branch
    #   main = stable integration line
    #   prod = production release branch
    branches: [dev, main, prod]
  pull_request:
    branches: [dev, main, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match .fvmrc and docs/Versions.md §1.
  FLUTTER_VERSION: 3.47.1

jobs:
  banned-imports:
    name: Banned imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rules that no stock lint can express (docs/Conventions.md §1, docs/Versions.md §4).
      #
      # NOTE: these are `grep` heuristics on source text, so they only consider
      # *code* lines — doc comments and comments are stripped first, otherwise a
      # comment that merely mentions `print()` or `StateNotifierProvider` (as the
      # docs and this very workflow do) would fail the build.
      - name: Enforce project import policy
        run: |
          set -euo pipefail
          fail=0

          # Matches are reported against code only: everything from the first `//`
          # onward is stripped before grepping. Approximate (a `//` inside a string
          # literal would be clipped) but the failure mode is a miss, not a false
          # alarm, and `flutter analyze` catches the real cases anyway.
          check() {
            local label="$1" pattern="$2" path="$3" skips="${4:-__none__}"
            local matches
            matches=$(
              find "$path" -name '*.dart' \
                ! -name '*.g.dart' ! -name '*.freezed.dart' ! -name '*.gr.dart' \
                -type f -print 2>/dev/null \
                | sort \
                | while IFS= read -r file; do
                    sed 's://.*$::' "$file" | sed "s|^|$file:|"
                  done \
                | grep -E "$pattern" || true
            )
            # $skips is a space-separated list of exempted file paths.
            local skip
            for skip in $skips; do
              [ -n "$matches" ] || break
              matches=$(printf '%s\n' "$matches" | grep -v -F "$skip:" || true)
            done
            if [ -n "$matches" ]; then
              echo "::error::$label"
              echo "$matches"
              fail=1
            fi
          }

          # 1. Legacy Riverpod providers are forbidden (use Notifier/AsyncNotifier/StreamNotifier).
          check \
            "Legacy Riverpod import. Use Notifier/AsyncNotifier/StreamNotifier (docs/Versions.md §4)." \
            "flutter_riverpod/legacy\.dart|StateNotifierProvider|ChangeNotifierProvider|StateProvider" \
            "lib"

          # 2. Material/Cupertino must come from the standalone packages, not the SDK.
          #    Reviewed exceptions where `adaptive_platform_ui`'s API is
          #    typed to the SDK widgets, which `cupertino_ui` can't satisfy:
          #    - adaptive_nav.dart:  `cupertinoTabBar` takes the SDK `CupertinoTabBar`.
          #    - app_scaffold.dart:  `cupertinoNavigationBar` is cast to the SDK
          #      `ObstructingPreferredSizeWidget`, so it needs the SDK
          #      `CupertinoNavigationBar`.
          #    - app_material_ancestor.dart: adaptive widget fallbacks use SDK
          #      ListTile/Slider and require the SDK Material ancestor.
          check \
            "Import package:flutter/material.dart or cupertino.dart. Use material_ui / cupertino_ui (docs/Versions.md §2)." \
            "package:flutter/(material|cupertino)\.dart" \
            "lib" \
            "lib/core/widgets/app_nav/adaptive_nav.dart lib/core/widgets/app_scaffold.dart lib/core/widgets/app_material_ancestor.dart"

          # 3. Web-unsafe libraries (docs/Platform.md §6).
          check \
            "dart:html / dart:js is not web-safe. Use package:web + dart:js_interop (docs/Platform.md §6)." \
            "dart:(html|js)['\"]" \
            "lib"

          # 4. No print() — use AppLogger (docs/Conventions.md §4).
          check \
            "print() found. Use AppLogger (docs/Conventions.md §4)." \
            "(^|[^A-Za-z0-9_.])print\(" \
            "lib"

          # 5. domain/ must stay pure Dart — no Flutter or data-layer packages (docs/Agent.md §3.1).
          check \
            "Forbidden import inside a feature's domain/ layer. domain must be pure Dart (docs/Architecture.md §1)." \
            "package:flutter|package:drift|package:dio|package:firebase|package:supabase|package:get_it" \
            "lib/features/*/domain"

          [ "$fail" -eq 0 ] && echo "Import policy OK."
          exit $fail

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      # Convenience escape hatch while local Flutter tooling is unavailable: if the
      # check fails, download the "format-fix" artifact below, unzip it over the
      # repo, and commit. Produced by `dart format .` — identical to running it
      # locally.
      - name: Produce formatting diff
        if: failure()
        run: |
          dart format . > /dev/null
          git diff --name-only
          tar -czf format-fix.tar.gz $(git diff --name-only)
      - name: Upload format-fix artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-fix
          path: format-fix.tar.gz
          retention-days: 7

  codegen-check:
    name: Codegen check
    runs-on: ubuntu-latest
    needs: [banned-imports]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Produces lib/**/*.g.dart (Drift) and lib/l10n/generated/**.
      # `analyze` and `test` depend on these existing, so they run after this job.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # Fail loudly if generation is not reproducible: a checked-in .g.dart that
      # no longer matches its source is a silent build hazard.
      - name: Verify generated code is up to date
        run: git diff --exit-code -- '*.g.dart' 'lib/l10n/generated/**'

  design-rules:
    name: Design rules
    runs-on: ubuntu-latest
    needs: [banned-imports]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The scanner reads generated sources too (`lib/l10n/generated` is skipped,
      # but the theme under test imports generated code), so generate first.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # docs/Design.md is only as strong as its enforcement (docs/Design.md §8).
      # `flutter test` below runs the file anyway; this job gives design drift its
      # own fast, isolated, unambiguous signal instead of hiding inside a
      # 1000-test wall.
      #
      # The test enforces per-file violation budgets in *both* directions: a file
      # that exceeds its budget fails (new debt), and a file that comes in under
      # fails too (stale budget). Debt can therefore only ever shrink — the
      # baseline can never quietly ossify into an allowlist.
      - name: Enforce docs/Design.md
        run: flutter test test/core/design_rules_test.dart --reporter expanded

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    needs: [banned-imports, codegen-check, design-rules]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # Zero warnings policy (docs/Conventions.md §1).
      - run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [banned-imports, codegen-check, design-rules]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - name: Run tests with coverage
        run: |
          set +e
          flutter test --coverage --reporter expanded 2>&1 | tee test_run.log
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -ne 0 ]; then
            echo "::error::Flutter test suite failed with exit code $TEST_EXIT"
            echo "### ❌ Test Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E '(\[E\]|FAIL|Expected:|Actual:|Golden mismatch|Pixel test failed)' -A 8 -B 2 test_run.log | tail -n 80 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Recent log lines</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            grep -E '\[E\]' test_run.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $TEST_EXIT
          fi
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: test_run.log
          retention-days: 7
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7
